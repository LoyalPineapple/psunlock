name: Build psunlock

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find and Build project
        shell: pwsh
        run: |
          # Find the project file recursively
          $proj = Get-ChildItem -Path . -Filter *.vcxproj -Recurse | Select-Object -First 1
          
          if ($null -eq $proj) {
              Write-Error "Could not find any .vcxproj file in the repository!"
              exit 1
          }
          
          Write-Host "Found project file at: $($proj.FullName)"
          
          # Build the project
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psunlock-exe
          # Recursively find the .exe so we don't have to guess the output folder
          path: '**/psunlock.exe'
