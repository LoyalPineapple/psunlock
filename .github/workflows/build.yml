name: Build psunlock
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1
      - name: Build
        run: msbuild psunlock.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: psunlock-exe
          path: x64/Release/psunlock.exe
