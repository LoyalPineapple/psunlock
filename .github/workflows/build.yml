name: Build psunlock

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List installed SDKs (diagnostic)
        run: |
          echo "Available Windows SDKs:"
          ls "C:\Program Files (x86)\Windows Kits\10\Include"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build project
        run: msbuild psunlock.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psunlock-exe
          path: x64/Release/psunlock.exe
